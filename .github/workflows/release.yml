name: Build & Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Binary
        run: Copy-Item target\release\clickr.exe Clickr.exe

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $TAG = if ($env:RELEASE_TAG) {
            $env:RELEASE_TAG
          } elseif ($env:INPUT_TAG) {
            $env:INPUT_TAG
          } else {
            $env:REF_NAME
          }

          Write-Host "Target tag is: $TAG"

          $exists = gh release view $TAG --json id -q ".id" 2>$null
          if ($exists) {
            Write-Host "Found existing release $TAG. Uploading Clickr.exe..."
            gh release upload $TAG Clickr.exe --clobber
          } else {
            Write-Host "Creating release $TAG and uploading Clickr.exe..."
            gh release create $TAG Clickr.exe --title "$TAG" --generate-notes
          }
