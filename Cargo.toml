[package]
name = "clickr"
version = "1.1.5"
edition = "2021"
authors = ["Fabian"]
license = "MIT"
description = "Ultra-lightweight native Win32 autoclicker built in Rust"
repository = "https://github.com/FabianDream/Clickr"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinInet",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
